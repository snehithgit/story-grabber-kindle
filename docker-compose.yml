services:
  story-grabber:
    image: ghcr.io/snehithgit/story-grabber-kindle:latest
    container_name: story-grabber-kindle
    restart: unless-stopped
    ports:
      # LAN/mobile access. Story Grabber still accepts only private/loopback hosts/clients.
      - "8000:8000"
    volumes:
      - ./story-grabber-data:/data
    shm_size: "1gb"
