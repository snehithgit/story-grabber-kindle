name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: story-grabber-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Story Grabber version
        id: version
        shell: bash
        run: |
          if [ -f VERSION ]; then
            VERSION="$(tr -d '\r\n ' < VERSION)"
          else
            VERSION="dev"
          fi

          VERSION="${VERSION#v}"

          if [ -z "$VERSION" ]; then
            VERSION="dev"
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/snehithgit/story-grabber-kindle:latest
            ghcr.io/snehithgit/story-grabber-kindle:v${{ steps.version.outputs.value }}
            ghcr.io/snehithgit/story-grabber-kindle:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true